<title>cyssbot — chargement</title>
<style>
  :root {
    --or: #ffd469;          /* couleur de cyssbot.png */
    --rouge: #852a20;       /* rouge tiré de cyssbot.png */
    --encre: #323232;
    --lum-rouge: #ff5a4e;   /* gyrophare */
    --lum-bleu: #5aa2ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 30%, #2b3244 0%, #14161d 70%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  .loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  /* ---------- cyssbot (image intégrée en base64 dans le CSS) ---------- */
  .scene {
    position: relative;
    width: 320px;
    height: 320px;
  }
  .scene::before {          /* halo pulsant derrière l'image */
    content: "";
    position: absolute;
    inset: -60px;
    background: radial-gradient(circle, rgba(255, 212, 105, .18) 0%, transparent 62%);
    animation: halo 1.6s ease-in-out infinite;
  }

  /* boules en orbite autour de l'image */
  .orbit {
    position: absolute;
    inset: -30px;
    pointer-events: none;
    animation: tourner 3s linear infinite;
  }
  .orbit.o2 {
    inset: -14px;
    animation: tournerInv 4s linear infinite;
  }
  .etincelle {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--or);
    box-shadow: 0 0 10px 2px rgba(255, 212, 105, .8);
  }
  .o2 .etincelle {
    width: 12px;
    height: 12px;
    background: var(--lum-bleu);
    box-shadow: 0 0 8px 2px rgba(90, 162, 255, .8);
  }
  .e1 { top: 0; left: 50%; }
  .e2 { bottom: 12%; left: 2%; }
  .e3 { top: 42%; right: 0; }
  .e4 { top: 6%; right: 18%; }
  .e5 { bottom: 4%; left: 30%; }
  .e6 { bottom: 18%; right: 6%; }
  .e7 { top: 34%; left: 0; }
  .etincelle.rouge {         /* boules rouges #852a20 (couleur de l'image) */
    background: var(--rouge);
    border: 2px solid var(--encre);
    box-shadow: 0 0 12px 3px rgba(133, 42, 32, .9);
  }

  .ombre {
    width: 150px;
    height: 22px;
    margin-top: 2px;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, .6) 0%, transparent 70%);
    animation: ombre 1.1s ease-in-out infinite;
  }

  /* ---------- barre de progression ---------- */
  .barre {
    width: 280px;
    height: 18px;
    border: 3px solid var(--encre);
    border-radius: 999px;
    background: rgba(255, 255, 255, .07);
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .4);
  }
  .remplissage {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: repeating-linear-gradient(45deg, var(--or) 0 14px, #eeb63c 14px 28px);
    background-size: 40px 100%;
    animation: remplir 2.8s linear infinite, rayures .5s linear infinite;
  }

  .texte {
    color: var(--or);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .points span {
    display: inline-block;
    animation: point 1.2s ease-in-out infinite;
  }
  .points span:nth-child(2) { animation-delay: .2s; }
  .points span:nth-child(3) { animation-delay: .4s; }

  .note {
    color: #8b93a7;
    font-size: 12px;
    letter-spacing: 1px;
  }

  /* ---------- animations ---------- */
  @keyframes rebond {
    0%, 100% { transform: translateY(0) scale(1, 1) rotate(0deg); }
    35%      { transform: translateY(-26px) scale(.97, 1.04) rotate(-3deg); }
    50%      { transform: translateY(0) scale(1.07, .9) rotate(0deg); }
    65%      { transform: translateY(-10px) scale(1, 1) rotate(3deg); }
    80%      { transform: translateY(0) scale(1.03, .97) rotate(0deg); }
    90%      { transform: translateY(-3px) scale(1, 1) rotate(0deg); }
  }
  @keyframes sirene {       /* lueur rouge/bleue façon gyrophare autour de l'image */
    0%, 100% { filter: drop-shadow(0 0 12px rgba(255, 90, 78, .85)); }
    50%      { filter: drop-shadow(0 0 24px rgba(90, 162, 255, .85)); }
  }
  @keyframes halo {
    0%, 100% { transform: scale(1); opacity: .7; }
    50%      { transform: scale(1.12); opacity: 1; }
  }
  @keyframes tourner {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes tournerInv {
    from { transform: rotate(360deg); }
    to   { transform: rotate(0deg); }
  }
  @keyframes ombre {
    0%, 100% { transform: scaleX(1); opacity: .55; }
    35%      { transform: scaleX(.7); opacity: .3; }
    50%      { transform: scaleX(1.06); opacity: .6; }
  }
  @keyframes remplir {
    from { width: 0; }
    to   { width: 100%; }
  }
  @keyframes rayures {
    from { background-position: 0 0; }
    to   { background-position: 40px 0; }
  }
  @keyframes point {
    0%, 60%, 100% { opacity: .15; }
    30%           { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bot, .orbit, .scene::before, .ombre, .points span, .remplissage {
      animation: none;
    }
    .remplissage { width: 65%; }
  }
</style>
</head>
<body>
  <div class="loader">
    <div class="scene">
      <div class="orbit o1">
        <i class="etincelle e1"></i>
        <i class="etincelle e2"></i>
        <i class="etincelle e3"></i>
        <i class="etincelle e6 rouge"></i>
      </div>
      <div class="orbit o2">
        <i class="etincelle e4"></i>
        <i class="etincelle e5"></i>
        <i class="etincelle e7 rouge"></i>
      </div>
      <div class="bot"></div>
    </div>

    <div class="ombre"></div>

    <div class="barre">
      <div class="remplissage"></div>
    </div>

    <p class="texte">Chargement<span class="points"><span>.</span><span>.</span><span>.</span></span></p>
  </div>
</body>
</html>
