layout: post
title: "Affichage de la gazette"
rank: 4
---

<div style="position: relative; width: 90%; height: 0; padding-top: 129.4118%;
 padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
 border-radius: 8px; will-change: transform;" class="center">
  <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0;margin: 0;"
  id="visualiser" allowfullscreen="allowfullscreen" allow="fullscreen">
</iframe>
</div>

<script type="text/javascript">
    const gazettes = [
      {% for gazette in site.data.gazettes.canva_projects %}
          {
            "name": "{{ gazette.name }}",
            "link": "{{ gazette.link }}",
            "pdf": "{{ gazette.pdf }}",
          },
      {% endfor %}
    ]

    const urlParams = new URLSearchParams(window.location.search);
    const projectName = urlParams.get('name');
    if(!projectName) {
      window.location.replace("/gazettes");
    }
    const gazette = gazettes.find(g => g.name === projectName);

    document.getElementById("visualiser").src = gazette.link+"?embed"
    document.getElementById("postTitle").innerText = `Votre Gazette : ${gazette.name}`
    document.getElementById("postAuthor").children[0].innerText = "Service Communication - CSSB"

    const container = document.getElementById("postHeader");
    if (container && gazette.pdf) {
        container.innerHTML += `
        <div style="margin-left: auto;">
            <p id="pdfDownload">
            <a href="${gazette.pdf}" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: none;">
            <i class="uil uil-import" style="font-size: 1.4em;"></i>
            </a>
            </p>
        </div>
        `;
    }
</script>
