<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body>

    {{ content }}

    {% include footer.html %}

    {% include search.html %}

    <script>
    // Pull-to-refresh on small screens: reload the page when the user scrolls
    // back to the top. Only after the page was actually scrolled down first,
    // so an overscroll bounce at the top does not trigger a spurious reload.
    var scrolledDown = false;
    function reloadOnScroll() {
      if (window.innerWidth >= 768) {
        return;
      }
      window.addEventListener('scroll', function () {
        if (window.scrollY > 50) {
          scrolledDown = true;
        } else if (window.scrollY === 0 && scrolledDown) {
          location.reload();
        }
      });
    }
    reloadOnScroll();
    </script>
    
  </body>
</html>
